name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on ubuntu because it is 1x billing, where windows-latest is 2x. Nothing in Core or the
  # tests needs Windows - that is the whole point of the platform seam.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test tests/GamingTranslatorGlassHUD.Core.Tests --no-build -c Release --logger "console;verbosity=normal"

      # Proves the whole pipeline still runs end to end - capture, OCR, normalisation, cache,
      # glossary, routing - without a game, a key, or a network call.
      - name: Replay the synthetic corpus
        run: dotnet run --project tools/Replay -c Release --no-build -- --no-cache

  # The compile safety net. The Windows test machine belongs to someone else and is rarely
  # available, so every push must prove the Windows TFM still builds and must leave behind a
  # runnable .exe - "testing" then costs a download rather than a build environment (brief 9).
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Self-contained FOLDER, not a single file. TesseractOCR ships its native DLLs as ordinary
      # copy-to-output content under x64/ rather than as runtimes/win-x64/native assets, and it
      # locates them at runtime from Assembly.Location - which is an empty string inside a
      # single-file bundle. Publishing single-file therefore loaded the managed wrapper fine and
      # then failed to find its own natives, which is what "No Tesseract found" on the overlay
      # actually meant. Nothing was gained by single-file anyway: tessdata, profiles, data and the
      # launcher scripts all ship alongside regardless, so it was always a folder.
      - name: Publish self-contained
        run: >
          dotnet publish src/GamingTranslatorGlassHUD.App/GamingTranslatorGlassHUD.App.csproj
          -f net10.0-windows -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o out

      - name: Ship the data files alongside the exe
        run: |
          Copy-Item -Recurse data out/data
          Copy-Item -Recurse profiles out/profiles
          if (-not (Test-Path out/tessdata)) { Copy-Item -Recurse tessdata out/tessdata }
          Copy-Item scripts/windows/*.bat out/
          Copy-Item README.md out/README.md
          Copy-Item README.ar.md out/README.ar.md
        shell: pwsh

      # The native Tesseract libraries and eng.traineddata have to survive publishing, or OCR
      # falls back to an exe that is not there and the app cannot read anything at all.
      - name: Verify the published payload
        run: |
          $missing = @()
          if (-not (Test-Path out/GamingTranslatorGlassHUD.exe)) { $missing += 'GamingTranslatorGlassHUD.exe' }
          if (-not (Test-Path out/tessdata/eng.traineddata))     { $missing += 'tessdata/eng.traineddata' }
          if (-not (Test-Path out/profiles/ffxiv/profile.json))  { $missing += 'profiles/ffxiv/profile.json' }
          if (-not (Test-Path out/data/models.json))             { $missing += 'data/models.json' }
          if (-not (Test-Path out/1-test-no-api-key.bat))        { $missing += '1-test-no-api-key.bat' }

          # The exact failure that reached the overlay on the first real run. These two DLLs are
          # what the managed wrapper P/Invokes into; without them OCR cannot start at all.
          if (-not (Test-Path out/x64/tesseract55.dll))          { $missing += 'x64/tesseract55.dll' }
          if (-not (Get-ChildItem out/x64/leptonica*.dll -ErrorAction SilentlyContinue)) { $missing += 'x64/leptonica*.dll' }
          if ($missing.Count -gt 0) { Write-Error "Missing from publish output: $($missing -join ', ')"; exit 1 }
          Get-ChildItem out | Select-Object Name, Length | Format-Table
        shell: pwsh

      - uses: actions/upload-artifact@v5
        with:
          name: GamingTranslatorGlassHUD-win-x64
          path: out
          if-no-files-found: error
